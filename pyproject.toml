[project]
name = "hytorch"
version = "0.1.0"
description = "Compose and train Git-backed meta-networks of coding agents with a PyTorch-shaped API."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Esteban Safranchik" }]
dependencies = []
keywords = ["agents", "git", "machine-learning", "multi-agent", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/safranchik/hytorch"
Documentation = "https://github.com/safranchik/hytorch#readme"
Repository = "https://github.com/safranchik/hytorch.git"
Issues = "https://github.com/safranchik/hytorch/issues"

[dependency-groups]
dev = [
    "matplotlib>=3.10",
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hytorch"]

[tool.hatch.build.targets.wheel.force-include]
"hytorch/runtime/hytorch-pi.mjs" = "hytorch/runtime/hytorch-pi.mjs"
"hytorch/runtime/package.json" = "hytorch/runtime/package.json"
"hytorch/runtime/Dockerfile" = "hytorch/runtime/Dockerfile"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
